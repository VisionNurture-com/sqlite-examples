name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sqlite-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          sqlite3 --version

      - name: Run all checks
        run: bash verify/run_all.sh sqlite3
